<div id="oc-remote-tui" aria-label="OpenCode TUI remote workspace concept">
<style>
#oc-remote-tui{--rt-bg:light-dark(#fafafa,#151515);--rt-panel:light-dark(#ededed,#202020);--rt-fg:light-dark(#252525,#e8e8e8);--rt-muted:light-dark(#646464,#aaa);--rt-line:light-dark(#d2d2d2,#393939);--rt-accent:light-dark(#975419,#e5ae76);--rt-green:light-dark(#246d40,#9dc99f);background:var(--rt-bg);color:var(--rt-fg);font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid var(--rt-line);color-scheme:light dark;padding:20px;overflow-wrap:anywhere}
#oc-remote-tui *{box-sizing:border-box}#oc-remote-tui button,#oc-remote-tui input,#oc-remote-tui textarea,#oc-remote-tui select{font:inherit;color:inherit;border:1px solid var(--rt-line);background:var(--rt-panel);padding:8px 12px;border-radius:0}#oc-remote-tui button{cursor:pointer}#oc-remote-tui button:hover{border-color:var(--rt-accent)}#oc-remote-tui button:disabled{opacity:.5;cursor:default}#oc-remote-tui .accent{color:var(--rt-accent)}#oc-remote-tui .muted{color:var(--rt-muted)}#oc-remote-tui .good{color:var(--rt-green)}#oc-remote-tui .small{font-size:12px}#oc-remote-tui .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#oc-remote-tui .top{border-bottom:1px solid var(--rt-line);padding-bottom:13px}#oc-remote-tui .main{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:26px;min-height:435px;padding:24px 0}#oc-remote-tui .conversation{min-width:0}#oc-remote-tui aside{border-left:1px solid var(--rt-line);padding-left:18px}#oc-remote-tui h2{font-size:15px;font-weight:500;margin:0 0 16px}#oc-remote-tui p{margin:0 0 16px}#oc-remote-tui .dialog{border:1px solid var(--rt-line);background:var(--rt-panel);padding:22px;max-width:580px;margin:24px auto}#oc-remote-tui .choices{display:grid;gap:8px;margin:18px 0}#oc-remote-tui .choices button{text-align:left}#oc-remote-tui .choices button:first-child{border-left:3px solid var(--rt-accent)}#oc-remote-tui .message{border-left:3px solid var(--rt-line);padding:12px 16px;margin:0 0 20px}#oc-remote-tui .agent{border-color:var(--rt-accent)}#oc-remote-tui .tool{padding:9px 12px;background:var(--rt-panel);margin:10px 0;font-size:12px}#oc-remote-tui pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:10px 0}#oc-remote-tui label{display:block;color:var(--rt-muted);font-size:12px;margin:12px 0 5px}#oc-remote-tui input,#oc-remote-tui select,#oc-remote-tui textarea{width:100%;min-width:0}#oc-remote-tui textarea{min-height:75px;resize:vertical;background:transparent;border:0;padding:4px 0}#oc-remote-tui .composer{background:var(--rt-panel);border-left:3px solid var(--rt-accent);padding:13px 17px;margin-top:6px}#oc-remote-tui footer{border-top:1px solid var(--rt-line);padding-top:14px;display:flex;gap:9px;flex-wrap:wrap}#oc-remote-tui .code{font-size:24px;letter-spacing:3px;padding:14px 0}#oc-remote-tui .diff{background:var(--rt-panel);padding:16px;color:var(--rt-green)}#oc-remote-tui .pad{margin-top:20px}#oc-remote-tui .summary{margin:20px 0}#oc-remote-tui .summary div{padding:4px 0}#oc-remote-tui .error{color:var(--rt-accent)}
@media(max-width:680px){#oc-remote-tui{padding:12px;font-size:13px}#oc-remote-tui .main{grid-template-columns:1fr;min-height:0;gap:15px}#oc-remote-tui aside{border-left:0;border-top:1px solid var(--rt-line);padding:12px 0 0}#oc-remote-tui aside .summary{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}#oc-remote-tui .dialog{padding:15px;margin:12px 0}#oc-remote-tui input,#oc-remote-tui textarea,#oc-remote-tui select{font-size:16px}}
@media(pointer:coarse){#oc-remote-tui button{min-height:44px}}
</style>
<div class="top row"><span>▀▄ <span class="muted">open</span>code <span class="accent">remote</span></span><span class="small muted">Workers-only TUI concept · simulated actions</span></div>
<div id="rt-view"></div>
<script>
(()=>{
const root=document.getElementById('oc-remote-tui'),view=root.querySelector('#rt-view');
const s={screen:'home',connected:false,attached:false,branch:'main',status:'idle',messages:[],draft:'',timer:null,checks:false,diff:false,shell:false,error:'',pending:''};
const design={details:true,accent:'Amber'};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(action,label)=>`<button type="button" data-action="${action}">${label}</button>`;
function style(){root.style.setProperty('--rt-accent',design.accent==='Amber'?'light-dark(#975419,#e5ae76)':'light-dark(#396da1,#9fc5ee)');const side=root.querySelector('aside'),main=root.querySelector('.main');if(side)side.hidden=!design.details;if(main)main.style.gridTemplateColumns=design.details?'':'minmax(0,1fr)';}
function render(){
if(s.screen==='home')view.innerHTML=`<div class="dialog"><h2>Remote workspaces</h2><p class="muted">Connect to a checkout on your server.</p><div class="choices">${button(s.connected?'repos':'login',s.connected?'＋ Clone repository':'→ Connect GitHub')}${s.attached?button('attach','↳ Resume oc-exp · '+esc(s.branch)) : ''}</div><p class="small muted">Server: ocx.example.workers.dev<br>Files, commands, and agent execution stay remote.</p></div>`;
if(s.screen==='login')view.innerHTML=`<div class="dialog"><h2>Connect GitHub</h2><div class="tool">Token file: ~/.config/ocx/github-token</div><p class="small muted">The real TUI reads a token from a local file and sends it to your authenticated Worker. This demo reads no file and connects no account.</p><div class="row">${button('authorized','Simulate authorization →')}${button('home','Cancel')}</div></div>`;
if(s.screen==='repos')view.innerHTML=`<form id="rt-clone" class="dialog"><h2>Clone into a remote workspace</h2><p class="good small">✓ GitHub connected · example-user</p><label for="rt-repo">Repository</label><select id="rt-repo"><option>example-user/oc-exp</option></select><label for="rt-branch">Base branch</label><select id="rt-branch"><option>main</option><option>staging</option></select><label for="rt-isolate"><input id="rt-isolate" type="checkbox" style="width:auto;display:inline"> Create a separate work branch</label><p class="small muted">Remote directory: /workspace/repo</p><div class="row"><button type="submit">Clone and attach →</button>${button('home','Cancel')}</div></form>`;
if(s.screen==='session')view.innerHTML=`<div class="main"><section class="conversation"><div class="row small muted"><span>oc-exp / ${esc(s.branch)}</span><span aria-live="polite">${s.status==='working'?'● Working remotely':s.status==='stopped'?'■ Interrupted':'● Connected'}</span></div><div class="pad">${s.messages.length?s.messages.map(m=>`<div class="message ${m.role==='OpenCode'?'agent':''}"><div class="small accent">${m.role}</div><div>${esc(m.text)}</div></div>`).join(''):'<div class="message agent"><div class="small accent">OpenCode</div>Repository cloned. You are in /workspace/repo.<br>What would you like to work on?</div>'}${s.status==='working'?'<div class="tool">◦ remote_shell · inspecting the checkout…</div>':''}${s.diff?'<div class="tool">remote_edit · README.md · +1</div>':''}${s.checks?'<div class="tool good">✓ remote_shell · test -s README.md · exit 0<br>Sample result</div>':''}</div><form id="rt-chat" class="composer"><label for="rt-prompt">${s.status==='working'?'Interrupt to change direction':'Message OpenCode'}</label><textarea id="rt-prompt" ${s.status==='working'?'disabled':''} placeholder="Ask anything about this repo…">${esc(s.draft)}</textarea><div class="row small"><span class="accent">Build <span class="muted">· project model</span></span>${s.status==='working'?button('interrupt','Interrupt'):'<button type="submit">Send ↵</button>'}</div></form></section><aside><h2>Workspace</h2><div class="summary small"><div class="good">● Remote</div><div>/workspace/repo</div><div>${esc(s.branch)}</div><div>GitHub · connected</div></div><h2>Changes</h2><div class="small muted">${s.diff?'README.md  +1':'No changes yet'}</div><div class="summary small muted">${s.checks?'Checks · 1 passed':'Checks · not run'}</div></aside></div><footer>${button('workspaces','Workspaces')}${button('changes','Changes')}${button('shell','Remote shell')}${button('detach','Detach')}</footer>`;
if(s.screen==='changes')view.innerHTML=`<div class="dialog"><h2>Changes · ${esc(s.branch)}</h2>${s.diff?'<p class="small muted">README.md · working tree</p><pre class="diff">+ All repository tools run in the remote workspace.</pre>':'<p class="muted">No working tree changes yet.</p>'}<div class="small muted">Sample diff for this concept.</div><div class="pad">${button('attach','Back to session')}</div></div>`;
if(s.screen==='shell')view.innerHTML=`<div class="dialog"><h2>Remote shell · /workspace/repo</h2><p class="small muted">Same checkout as the agent.</p><pre>$ pwd
/workspace/repo</pre>${s.shell?'<div class="tool good">$ test -s README.md<br>README file check passed. Exit 0.<br>Sample output</div>':''}<form id="rt-shell"><label for="rt-command">Command · demo supports test -s README.md</label><input id="rt-command" value="test -s README.md"><p class="error small" role="alert">${esc(s.error)}</p><div class="row"><button type="submit">Run remotely ↵</button>${button('attach','Back to session')}</div></form></div>`;
if(s.screen==='detached')view.innerHTML=`<div class="dialog"><h2>Detached from oc-exp</h2><p class="muted">Your files and session are still on the server.</p><div class="tool" role="status">${s.status==='working'?'● Agent is still working remotely':s.status==='stopped'?'■ Agent was interrupted':'◌ Session saved · ready to resume'}</div>${button('attach','Reattach to session →')}</div>`;
style();}
function start(text){s.messages.push({role:'You',text});s.pending=text;s.draft='';s.status='working';clearTimeout(s.timer);s.timer=setTimeout(()=>{s.status='idle';const testing=/test|check/i.test(s.pending);if(testing)s.checks=true;else s.diff=true;s.messages.push({role:'OpenCode',text:testing?'The sample README file check passed. In the implementation, I would run the project checks remotely and show their actual output.':'I added a note about remote repository tools to README.md. This is a sample response; continue here or inspect the changes.'});render();},1800);render();}
root.addEventListener('input',e=>{if(e.target.id==='rt-prompt')s.draft=e.target.value;});
root.addEventListener('click',e=>{const el=e.target.closest('button[data-action]');if(!el)return;switch(el.dataset.action){case'login':s.screen='login';break;case'authorized':s.connected=true;s.screen='repos';break;case'home':case'workspaces':s.screen='home';break;case'repos':s.screen='repos';break;case'attach':s.screen='session';break;case'changes':s.screen='changes';break;case'shell':s.screen='shell';break;case'detach':s.screen='detached';break;case'interrupt':clearTimeout(s.timer);s.status='stopped';s.messages.push({role:'OpenCode',text:'Interrupted. Send another message to continue from this checkout.'});break;}render();});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='rt-clone'){clearTimeout(s.timer);s.branch=root.querySelector('#rt-isolate').checked?'oc/remote-tools':root.querySelector('#rt-branch').value;s.attached=true;s.messages=[];s.diff=false;s.checks=false;s.shell=false;s.status='idle';s.draft='';s.screen='session';render();}else if(e.target.id==='rt-chat'){const text=root.querySelector('#rt-prompt').value.trim();if(text)start(text);}else if(e.target.id==='rt-shell'){if(root.querySelector('#rt-command').value.trim()!=='test -s README.md'){s.error='This demo only simulates test -s README.md.';}else{s.shell=true;s.checks=true;s.error='';}render();}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:style});tweak.addToggle(design,'details',{label:'Workspace sidebar'});tweak.addSelect(design,'accent',{label:'Terminal accent',options:['Amber','Blue']});}
})();
</script>
</div>
